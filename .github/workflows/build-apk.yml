name: Build Latest Debug APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # GitHub Releases üzerinde her zaman tek bir "latest-apk" tutar, eskisinin üzerine yazar:
      - name: Upload & Overwrite Latest APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "FitPilot Beta - Güncel APK (Otomatik)"
          body: "Son yapılan kod değişiklikleriyle otomatik üretilen en güncel APK dosyasıdır. Eski APK otomatik olarak silinmiş ve yenisiyle değiştirilmiştir."
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true